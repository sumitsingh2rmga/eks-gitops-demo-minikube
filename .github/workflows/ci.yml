name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["k8s/**", "docs/**", "README.md"]   # the bot's manifest commit must not retrigger CI
  pull_request:
    paths-ignore: ["k8s/**", "docs/**", "README.md"]

permissions:
  contents: read

env:
  IMAGE: sumitsinghrmga/eks-gitops-demo

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install
        run: pip install -r app/requirements.txt pytest flake8
      - name: Lint
        run: flake8 app --max-line-length 100
      - name: Unit tests
        run: pytest app -q

  build-and-push-docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # lets the last step commit the new image tag
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build locally first (not pushed) so Trivy can scan it
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # 2. Scan before publishing. Pin this action to a release tag or commit SHA
      #    (check the Marketplace) instead of @master.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # 3. Log in only after the scan passes
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Push the scanned image
      - name: Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # 5. Write the new tag back to Git so Argo CD deploys it
      - name: Update image tag in Git (GitOps)
        run: |
          cd k8s/overlays/dev
          sed -i "s|newName:.*|newName: ${IMAGE}|; s|newTag:.*|newTag: \"${GITHUB_SHA}\"|" kustomization.yaml
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "deploy ${GITHUB_SHA::7} to dev" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
